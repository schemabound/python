[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemabound-sdk"
version = "0.1.0"
description = "Python SDK for SCHEMABOUND (Object Agent Mapper)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "grpcio>=1.69.0",
    "protobuf>=5.29.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "email-validator>=2.3.0",
    "faker>=37.12.0",
]
dev = [
    "grpcio-tools>=1.50.0",
    "black",
    "isort",
    "mypy"
]

[tool.hatch.build.targets.wheel]
packages = ["schemabound_sdk"]

[dependency-groups]
dev = [
    "mysql-connector-python>=9.4.0",
    "pydantic-extra-types>=2.11.0",
    "types-grpcio>=1.0.0.20251009",
    "types-protobuf>=6.32.1.20251210",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "grpcio-tools>=1.50.0",
    "pytest>=8.4.2",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
